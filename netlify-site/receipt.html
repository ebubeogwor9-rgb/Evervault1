<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evervault · Transaction Receipt</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #eef2f7; color: #1f2d3d; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 30px 0; }
.card { background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.12); width: 480px; max-width: 94vw; padding: 28px 26px; }
.logo { font-size: 28px; font-weight: 700; color: #0f6bff; margin-bottom: 20px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
.logo .logo-icon { margin-right: 4px; }
.logo span { color: #1f2d3d; }
.logo-icon { display: block; }
h2 { font-size: 20px; margin-bottom: 6px; }
.sub { color: #5b6b7b; font-size: 13px; margin-bottom: 18px; text-align: center; }
button { width: 100%; margin-top: 14px; padding: 13px; background: #0f6bff; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
button:hover { background: #0a58d0; }
button.secondary { background: #eef2f7; color: #3a4a5a; margin-top: 10px; }
button.secondary:hover { background: #e2e9f2; }
.hidden { display: none; }
.receipt { border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
.receipt-head { background: #eef7ff; color: #0a58d0; font-weight: 700; font-size: 14px; padding: 10px 14px; text-align: center; }
.receipt-status { text-align: center; padding: 14px; background: #e6f7ee; color: #0b7a3b; font-weight: 700; font-size: 15px; }
.receipt-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 14px; border-top: 1px solid #eef1f5; font-size: 13px; }
.receipt-row .k { color: #5b6b7b; white-space: nowrap; }
.receipt-row .v { font-weight: 600; text-align: right; word-break: break-all; }
.none-box { text-align: center; padding: 30px 10px; color: #5b6b7b; font-size: 14px; }
.overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
.overlay.hidden { display: none; }
.overlay-card { background: #fff; border-radius: 14px; padding: 30px 40px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.spinner { width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #0f6bff; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.overlay-title { font-size: 16px; font-weight: 700; color: #1f2d3d; }
.overlay-sub { font-size: 13px; color: #5b6b7b; margin-top: 4px; }
body.dark { background: #10141c; color: #e6eaf2; }
body.dark .card { background: #1b2230; }
body.dark .logo span { color: #e6eaf2; }
body.dark .sub { color: #8a93a8; }
body.dark .receipt { border-color: #3a4256; }
body.dark .receipt-head { background: #1a3550; color: #bfe0ff; }
body.dark .receipt-row { border-color: #2c3448; }
body.dark .receipt-row .k { color: #8a93a8; }
body.dark .none-box { color: #8a93a8; }
body.dark button.secondary { background: #232b3b; color: #e6eaf2; }
body.dark button.secondary:hover { background: #2c3448; }
body.dark .overlay-card { background: #1b2230; }
body.dark .overlay-title { color: #fff; }
body.dark .overlay-sub { color: #8a93a8; }
</style>
</head>
<body>

<div class="card">
  <div class="logo"><svg class="logo-icon" viewBox="0 0 40 40" width="44" height="44" aria-hidden="true"><rect x="3" y="7" width="34" height="26" rx="7" fill="#0f6bff"/><circle cx="20" cy="20" r="8.5" fill="#fff"/><circle cx="20" cy="20" r="5.5" fill="none" stroke="#0f6bff" stroke-width="1.8"/><circle cx="20" cy="19.5" r="2.4" fill="#0f6bff"/><rect x="18.9" y="20.4" width="2.2" height="5" fill="#0f6bff" rx="1"/></svg>Ever<span>vault</span></div>
  <h2 style="text-align:center;">Transaction Receipt</h2>
  <p class="sub">Your transfer was completed successfully.</p>

  <div id="receiptBox" class="receipt hidden">
    <div class="receipt-head">Bank Transfer Details</div>
    <div class="receipt-status">Completed</div>
    <div class="receipt-row"><span class="k">Transaction ID</span><span class="v" id="rcId"></span></div>
    <div class="receipt-row"><span class="k">Date &amp; Time</span><span class="v" id="rcTime"></span></div>
    <div class="receipt-row"><span class="k">From</span><span class="v" id="rcFrom"></span></div>
    <div class="receipt-row"><span class="k">To</span><span class="v" id="rcTo"></span></div>
    <div class="receipt-row"><span class="k">Amount</span><span class="v" id="rcAmount"></span></div>
    <div class="receipt-row"><span class="k">Fee</span><span class="v">$0.00</span></div>
    <div class="receipt-row"><span class="k">Balance After</span><span class="v" id="rcBalance"></span></div>
  </div>

  <div class="none-box hidden" id="rcNone">No receipt available.<br>Make a transfer first and you'll be brought back here with your receipt.</div>

  <button id="againBtn">Make Another Transfer</button>
  <button class="secondary" id="backBtn">Go Back</button>
</div>

<div class="overlay hidden" id="loadingOverlay">
  <div class="overlay-card">
    <div class="spinner"></div>
    <div class="overlay-title" id="loadTitle">Loading</div>
    <div class="overlay-sub" id="loadSub">Please wait...</div>
  </div>
</div>

<script>
function $(id) { return document.getElementById(id); }

function showLoading(title, sub) {
  $("loadTitle").textContent = title;
  $("loadSub").textContent = sub;
  $("loadingOverlay").classList.remove("hidden");
}

var savedTheme = localStorage.getItem("securebank_theme") || "white";
document.body.classList.toggle("dark", savedTheme === "black");

try {
  var r = JSON.parse(sessionStorage.getItem("lastReceipt") || "null");
  if (r) {
    $("receiptBox").classList.remove("hidden");
    $("rcId").textContent = r.id || "-";
    $("rcTime").textContent = r.time || "-";
    $("rcFrom").textContent = r.from || "-";
    $("rcTo").textContent = r.to || "-";
    $("rcAmount").textContent = r.amount || "-";
    $("rcBalance").textContent = r.balance || "-";
  } else {
    $("rcNone").classList.remove("hidden");
  }
} catch (e) {
  $("rcNone").classList.remove("hidden");
}

$("againBtn").addEventListener("click", function () {
  showLoading("Opening Transfer", "Please wait...");
  location.href = "bankingsite.html#transfer";
});

$("backBtn").addEventListener("click", function () {
  showLoading("Going Back", "Please wait...");
  location.href = "bankingsite.html";
});
</script>
</body>
</html>
